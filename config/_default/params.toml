# -------------------------
# Mainroad Theme Parameters
# https://github.com/Vimux/Mainroad
# -------------------------

description = "Daily tech intelligence for software builders - AI, programming, and the modern web."
copyright = "Stack Moments Daily"
opengraph = true
schema = true
twitter_cards = true
readmore = true
authorbox = false
toc = true
pager = true
post_meta = ["date", "categories"]
mainSections = ["posts", "briefs"]
dateformat = "January 2, 2006"
customCSS = ["css/custom.css"]

[style.vars]
  highlightColor = "#0057b8"
  fontFamilyPrimary = "'Georgia', 'Times New Roman', serif"
  fontFamilySecondary = "'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace"

[logo]
  title = "Stack Moments"
  subtitle = "Daily Intelligence"

[thumbnail]
  visibility = ["list", "post"]

[sidebar]
  home = "right"
  list = "right"
  single = "right"
  widgets = ["search", "series", "recent", "categories", "taglist"]

[widgets]
  recent_num = 6
  categories_counter = true
  tags_counter = false

[widgets.search]
  url = "https://google.com/search"
  [widgets.search.input]
    name = "sitesearch"
    pre = ""
