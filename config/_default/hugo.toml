# -- Site Configuration --
# Mainroad theme - https://github.com/Vimux/Mainroad

theme = "mainroad"
baseURL = "https://daily.stackmoments.com/"
title = "Stack Moments Daily"
defaultContentLanguage = "en"

canonifyURLs = true

enableRobotsTXT = true
summaryLength = 70

buildDrafts = false
buildFuture = true

enableEmoji = true

[services]
  [services.googleAnalytics]
    ID = "G-T19DB18Q8F"

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]

[Author]
  name = "Stack Moments"
  bio = "Daily intelligence for software builders — covering AI, cloud infrastructure, and the modern developer ecosystem."

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
